<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | StudentHub Portal</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">

        <img src="../images/logo.png"
             alt="StudentHub Logo">

        <h2>StudentHub</h2>

    </div>


    <nav>

        <a href="../index.html">
            Home
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="courses.html">
            Courses
        </a>

        <a href="attendance.html">
            Attendance
        </a>

        <a href="assignment.html">
            Assignments
        </a>

        <a href="result.html">
            Results
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a href="login.html">
            Login
        </a>

        <a href="register.html">
            Register
        </a>

    </nav>

</header>


<!-- ================= CONTACT ================= -->

<section class="about">

    <h2>
        Contact StudentHub
    </h2>


    <!-- SUCCESS / ERROR MESSAGE -->

    <div id="message"></div>


    <form
        action="../php/contact.php"
        method="POST">


        <!-- NAME -->

        <label for="name">
            Your Name
        </label>

        <br>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required>

        <br>
        <br>


        <!-- EMAIL -->

        <label for="email">
            Email Address
        </label>

        <br>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>

        <br>
        <br>


        <!-- SUBJECT -->

        <label for="subject">
            Subject
        </label>

        <br>

        <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Enter subject"
            required>

        <br>
        <br>


        <!-- MESSAGE -->

        <label for="messageText">
            Message
        </label>

        <br>

        <textarea
            id="messageText"
            name="message"
            rows="6"
            placeholder="Write your message..."
            required></textarea>

        <br>
        <br>


        <!-- SUBMIT -->

        <button
            class="btn"
            type="submit">

            Send Message

        </button>


    </form>


</section>


<!-- ================= FOOTER ================= -->

<footer>

    <p>
        © 2026 StudentHub Portal |
        All Rights Reserved.
    </p>

</footer>


<script>

    /* ==============================
       DISPLAY PHP MESSAGE
       ============================== */

    const params =
        new URLSearchParams(window.location.search);

    const status =
        params.get("status");

    const message =
        document.getElementById("message");


    if (status === "success") {

        message.innerHTML =
            "<p style='color:green; font-weight:bold;'>Your message was submitted successfully!</p>";

    }


    if (status === "error") {

        message.innerHTML =
            "<p style='color:red; font-weight:bold;'>Message submission failed. Please check your information.</p>";

    }

</script>


</body>

</html>
