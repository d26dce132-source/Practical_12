<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | StudentHub Portal</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

    <div class="logo">
        <img src="../images/logo.png" alt="Logo">
        <h2>StudentHub</h2>
    </div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Profile</a>
        <a href="courses.html">Courses</a>
        <a href="attendance.html">Attendance</a>
        <a href="assignment.html">Assignments</a>
        <a href="result.html">Results</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
    </nav>

</header>

<section class="about">

<h2>Student Login</h2>

<div id="message"></div>
<form action="../php/login.php" method="POST">

    <label for="email">
        Email
    </label>

    <br>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required>

    <br><br>


    <label for="password">
        Password
    </label>

    <br>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required>

    <br><br>


    <label>
        <input
            type="checkbox"
            name="remember"
            value="1">

        Remember Me
    </label>

    <br><br>


    <button
        type="submit"
        class="btn">

        Login

    </button>

</form>

<br>

<p>Don't have an account?
<a href="register.html">Register Here</a></p>

</section>

<footer>

<p>© 2026 StudentHub Portal | All Rights Reserved.</p>

</footer>

<script>

const params =
    new URLSearchParams(window.location.search);

const status =
    params.get("status");

const message =
    document.getElementById("message");


if (status === "invalid") {

    message.innerHTML =
        "<p style='color:red;font-weight:bold;'>Invalid email or password.</p>";

}


if (status === "empty") {

    message.innerHTML =
        "<p style='color:red;font-weight:bold;'>Please enter email and password.</p>";

}


if (status === "timeout") {

    message.innerHTML =
        "<p style='color:red;font-weight:bold;'>Your session has expired. Please login again.</p>";

}


if (status === "logout") {

    message.innerHTML =
        "<p style='color:green;font-weight:bold;'>You have been logged out successfully.</p>";

}

</script>

</body>
</html>
